# MAGI Configuration File

# IMPORTANT!
# Avoid hardcoding API keys in this file! 
# Any value in the format ${ENV_VAR_NAME} will be replaced with the value of
# the corresponding environment variable at runtime. 


# If no model is specified from the command line, MAGI will use the model specified here.
default_model: ollama

# Default key for the system_prompts map below.
default_system_prompt: deepseek

# Define one or more named system prompts. The --system-prompt CLI flag selects a key.
system_prompts:
  default: |
    You are a helpful assistant that can perform tasks for the user.
    You have access to tools and can use them to accomplish tasks.
    Always try to use tools when appropriate, and be sure to follow
    the instructions provided by the user.
  code_review: |
    You are an expert code reviewer. Provide actionable feedback and highlight risks.
  watch: |
    You are a code assistant that can watch a codebase implement requested
    changes. You will be given the file contents where a user has added one or
    more comments ending with `AI!`. Your task is to implement the requested
    change, ensuring that the change addresses the user's comment. You should
    replace or remove the `AI!` comment in your implementation. If the user's
    comment is unclear, make a best effort to interpret their intent and
    implement a change that you think would be helpful. 

# If no sessionis specified from the command line, MAGI will use the session
# name specified here. The session name is used to persist the conversation
# history accross runs.
session: main

# Tool approval configuration.
#
# By default every tool call (and every skill call) is confirmed by the user
# before it runs. Each tool can be auto-approved individually so safe,
# read-only tools run without prompting while riskier ones stay gated.
#
# Precedence for a single tool, highest first:
#   1. listed under `require_approval`  -> always prompt
#   2. listed under `approved_tools`    -> never prompt
#   3. safe by construction             -> never prompt (bash_readonly)
#   4. `auto_approve: true`             -> never prompt (all tools)
#   5. otherwise                        -> prompt
#
# The -y/--auto-approve CLI flag overrides this section entirely.
#
# Built-in tool names: bash, bash_readonly, read_file, edit_file,
# deepseek_search, deepseek_fetch. Skill tools can be named here too.
#
# `bash_readonly` runs commands from a read-only allowlist (cat, ls, rg,
# grep, find, git log/show/diff, ...) without a shell and inside a sandbox,
# so it does not prompt unless you list it under `require_approval` below.
tool_approval:
  # Approve every tool call without prompting.
  auto_approve: false

  # Tools that never require approval. Keep `bash` and `edit_file` out of this
  # list unless you really want unattended command execution and file edits.
  approved_tools:
    - read_file
    - deepseek_search
    - deepseek_fetch

  # Tools that always prompt, even when `auto_approve` is true.
  require_approval:
    - bash
    - edit_file

  # Skills require approval by default too; set to true to load skills without
  # prompting.
  auto_approve_skills: false

# Legacy: a top level `auto_approve: true` behaves like
# `tool_approval.auto_approve: true`. Prefer the section above.
# auto_approve: false

# Shell sandbox configuration.
#
# The `bash` tool can run its commands inside bubblewrap: the project
# directory is writable, the rest of the filesystem is read-only, and `$HOME`
# points at a throwaway directory unless you bind the real one below. This is
# a blast-radius limit, not a permission system - commands still need
# approval, and approval is what decides whether they run at all.
#
# `bash_readonly` uses the sandbox too, always without network access, so its
# allowlist has a second line of defence. Set `mode: off` to disable
# sandboxing everywhere (the allowlist still applies to bash_readonly).
sandbox:
  # auto    - sandbox when bwrap is installed, otherwise run unsandboxed
  # require - refuse to run bash at all when bwrap is unavailable
  # off     - never sandbox
  mode: auto

  # Allow network access inside the sandbox for the `bash` tool. The
  # read-only tool never gets the network.
  network: true

  # Extra directories to bind read-write inside the sandbox, for example a
  # cache or a sibling repository. Binding your home directory disables most
  # of the protection; prefer specific paths.
  # writable_paths:
  #   - ~/.cache

# Model Configurations Currently models only support the OpenAI API Format.
# Future versions may support additional formats.
#
# Each model configuration must include the following fields: 
# - base_url: The base URL for the model's API endpoint. 
# - api_key: The API key for authenticating with the model's API. This 
#   should be set using an environment variable for security reasons. 
# - model: The specific model name or identifier
models:
  glm-5:
    base_url: https://openrouter.ai/api/v1/
    api_key: ${OPENROUTER_API_KEY}
    model: z-ai/glm-5
  ollama:
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: qwen3.8:27b
  deepseek-reasoner:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-reasoner
  deepseek-chat:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat
